[project]
name = "progis-fork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "absl-py>=2.4.0",
    "certifi>=2022.12.7",
    "charset-normalizer>=2.1.1",
    "click>=8.3.1",
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "debugpy>=1.8.20",
    "diskcache>=5.6.3",
    "distinctipy>=1.3.4",
    "efficientnet-pytorch>=0.7.1",
    "filelock>=3.25.2",
    "fonttools>=4.62.1",
    "fsspec>=2026.2.0",
    "grpcio>=1.78.0",
    "h5py>=3.16.0",
    "hf-xet>=1.4.2",
    "huggingface-hub>=1.8.0",
    "idna>=3.4",
    "imageio>=2.37.3",
    "ipykernel>=7.2.0",
    "ipython>=9.11.0",
    "joblib>=1.5.3",
    "jupyter-client>=8.8.0",
    "jupyter-core>=5.9.1",
    "kiwisolver>=1.5.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.8",
    "mpmath>=1.3.0",
    "nest-asyncio>=1.6.0",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "packaging>=24.1",
    "pandas>=3.0.1",
    "petroscope>=0.0.12",
    "pillow>=12.1.1",
    "protobuf>=7.34.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "pyparsing>=3.3.2",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
    "requests>=2.28.1",
    "requests-toolbelt>=1.0.0",
    "safetensors>=0.7.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "six>=1.17.0",
    "sympy>=1.14.0",
    "tensorboard>=2.20.0",
    "tensorboard-data-server>=0.7.2",
    "thop>=0.1.1.post2209072238",
    "threadpoolctl>=3.6.0",
    "tifffile>=2026.3.3",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66.5",
    "triton>=3.6.0 ; sys_platform != 'darwin'",
    "typing-extensions>=4.15.0",
    "tzdata>=2025.3",
    "urllib3>=1.26.13",
    "wcwidth>=0.6.0",
    "werkzeug>=3.1.7",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
