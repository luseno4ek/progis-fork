# ─────────────────────────────────────────────────────────────────────────────
# ProGIS — Server BCSS configuration (histology server, CUDA)
#
# Data layout on server:
#   /srv/data1/data_repository/BCSS/patches/
#     all/image_npy/
#     tumor/mask_npy/  tumor/signal_all_line_npy/
#     stroma/...       inflammatory_infiltration/...  etc.
#     fold_splits.json
#
# Stage 2 training (full, 50 epochs):
#   python -m progis_rework.training.train_stage2 --config progis_rework/configs/server_bcss.yaml
#
# With per-run overrides (e.g. different fold or device):
#   python -m progis_rework.training.train_stage2 \
#       --config progis_rework/configs/server_bcss.yaml \
#       --fold 2 --device cuda:1
#
# Evaluation (NoI metric, n_iter=20):
#   python -m progis_rework.inference.evaluate \
#       --config progis_rework/configs/server_bcss.yaml \
#       --roi_ckpt runs/stage2/fold1/2026-03-22_14-05/stage2_best.pth
# ─────────────────────────────────────────────────────────────────────────────

data:
  patches_dir:  /srv/data1/data_repository/BCSS/patches
  splits_json:  /srv/data1/data_repository/BCSS/patches/fold_splits.json
  fold:         1
  cls:          all          # all tissue classes jointly
  crop_size:    256

model:
  backbone:      efficientunet
  roi_ckpt:      ""           # fill after training: runs/stage2/fold1/stage2_best.pth
  proj_ckpt:     ""           # fill after simclr_proj training (simclr backbone only)
  threshold:     0.5
  seg_threshold: 0.95

simclr_proj:
  proj_channels:  32
  epochs:         10
  batch_size:     16
  num_workers:    4
  lr:             1.0e-3
  weight_decay:   0.0
  device:         cuda:1
  checkpoint_dir: runs/simclr_proj/fold1
  tensorboard:    true
  seed:           42

stage2:
  epochs:         50
  batch_size:     16
  num_workers:    4
  lr:             4.0e-4
  weight_decay:   0.0
  device:         cuda:1
  checkpoint_dir: runs/stage2/fold1
  tensorboard:    true

eval:
  n_iter:      20
  threshold:   0.5
  batch_size:  16
  num_workers: 4
  device:      cuda:1
  results_dir: runs/stage2/fold1/20260323_2103/results_best

api:
  host:      "0.0.0.0"
  port:      8000
  device:    cuda:1
  crop_size: 256
